name: ClaimCheck CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Phase 0-1 is offline. Blank both provider credentials so CI cannot call a model.
    env:
      XAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify baseline present
        run: |
          test -f requirements.txt
          test -f src/policy.py
          test -f tests/test_policy.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check for forbidden tracked secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env($|\.)|secrets\.toml$|id_rsa$|.*\.pem$)' ; then
            echo 'Forbidden secret-like tracked file'; exit 1
          fi
