name: API CI

on:
  pull_request:
    paths:
      - "service/**"
      - "src/**"
      - "data/**"
      - "scripts/sync_service.py"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "service/**"
      - "src/**"
      - "data/**"
      - "scripts/sync_service.py"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Offline: blank provider credentials so CI can never call a paid model.
    env:
      XAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the engine copy matches src/
        run: python scripts/sync_service.py --check
      - name: Install API dependencies
        run: python -m pip install -r service/requirements.txt pytest==9.2.0 httpx==0.28.1
      - name: Run API tests
        working-directory: service
        run: python -m pytest -q
